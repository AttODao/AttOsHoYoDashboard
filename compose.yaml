services:
  db:
    image: postgres:18-alpine3.23
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      DB_NAME: ${DB_NAME:-attos_dashboard}
      DB_USER: ${DB_USER:-attos_dashboard}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: attos-hoyo-dashboard:local
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-attos_dashboard}
      DB_USER: ${DB_USER:-attos_dashboard}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      HOYOLAB_COOKIE_KEY: ${HOYOLAB_COOKIE_KEY:?Set HOYOLAB_COOKIE_KEY in .env}
      BIND_ADDR: 0.0.0.0:8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://ahd.example.com}
      RP_ID: ${RP_ID:-ahd.example.com}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      TIMEZONE_OFFSET: ${TIMEZONE_OFFSET:-+09:00}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
