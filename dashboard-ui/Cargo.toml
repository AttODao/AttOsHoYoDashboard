[package]
name = "attos-dashboard-ui"
version = "1.5.0"
authors = ["AttODao"]
license = "GPL-3.0-or-later"
repository = "https://git.attodao.cc/AttODao/AttOsHoYoDashboard"
edition = "2024"
publish = false

[features]
default = ["web"]
web = ["dioxus/web"]
# Android app (`dx build --platform android`): native HTTP client and app-only screens.
mobile = ["dioxus/mobile", "dep:reqwest", "dep:tokio", "dep:chrono", "dep:url", "dep:webbrowser", "dep:getrandom", "dep:sha2"]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "document", "asset"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
base64 = "0.22"
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlDialogElement", "CssStyleDeclaration", "MediaQueryList", "MouseEvent", "FocusEvent", "Node", "DomRect", "Storage", "Event", "EventTarget", "Crypto", "Clipboard", "Navigator", "Location", "History", "RequestCredentials", "CredentialsContainer", "CredentialCreationOptions", "CredentialRequestOptions", "PublicKeyCredential", "AuthenticatorResponse", "AuthenticatorAttestationResponse", "AuthenticatorAssertionResponse"] }

# Native (mobile) API client; the browser build keeps using fetch through gloo-net.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
url = { version = "2", optional = true }
# Opens the web version in the device's default browser (Intent ACTION_VIEW on Android).
webbrowser = { version = "1.2", optional = true, features = ["hardened"] }

[dev-dependencies]
# The app's platform-free modules (`mobile::session`, `mobile::time`, `mobile::browser_login`) run in every test run.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
