[workspace]
members = ["dashboard-ui"]
default-members = ["."]
resolver = "3"

[package]
name = "attoshoyodashboard"
version = "1.2.2"
edition = "2024"
default-run = "attoshoyodashboard"

[dependencies]
argon2 = "0.5"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
derive_more = { version = "2", default-features = false, features = ["debug"] }
dotenvy = "0.15"
md5 = "0.8"
openssl = "0.10"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sea-orm = { version = "2.0", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-chrono", "with-uuid", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
# conditional-ui only supplies the challenge generator for decoy passkey login options.
webauthn-rs = { version = "0.5", default-features = false, features = ["conditional-ui"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
