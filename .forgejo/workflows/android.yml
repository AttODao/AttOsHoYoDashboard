# Build the release packages for every version tag and attach them to the Forgejo release.
# Asset names, checksums, signing and test tags: docs/releases.md.
# The container image is built and published by image.yml.
name: android
on:
  push:
    tags: ['v*']

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"

jobs:
  apk:
    runs-on: docker
    timeout-minutes: 180
    container:
      image: nixos/nix:2.35.3@sha256:ff480dbb23511aa1c10710aa068ceea5b93fed9bfce5f5379f3a6b07282cbc7b
    steps:
      - name: Clone exact revision
        run: |
          set -eu
          git clone -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git checkout -q "$GITHUB_SHA"
      - name: Verify version
        run: |
          set -eu
          bash scripts/release-version.sh "$GITHUB_REF_NAME" > release-version.env
          cat release-version.env
          cat release-version.env >> "$GITHUB_ENV"
      - name: Install devenv
        run: |
          set -eu
          nix profile add github:NixOS/nixpkgs/3ec636362e1816bc2f0888fa0fa2c69f1bc9e504#devenv
          devenv version
      - name: Build APK
        env:
          AHD_SERVER_URL: ${{ vars.AHD_SERVER_URL || 'https://hoyo.attodao.cc' }}
          CARGO_BUILD_JOBS: '2'
        run: devenv --profile android shell -- build-android --release
      - name: Sign, check and package
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # build-tools are not on the android profile's PATH.
          build_tool() {
            # shellcheck disable=SC2016 # expanded by the inner bash
            devenv --profile android shell -- bash -c 'tool=$1; shift; exec "$ANDROID_HOME/build-tools/34.0.0/$tool" "$@"' build-tool "$@"
          }
          apk=target/dx/attos-dashboard-ui/release/android/app/app/build/outputs/apk/debug/app-debug.apk
          APK_NAME="ahd-android-${VERSION}-arm64.apk"
          install -d -m755 dist
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ks_dir=${RUNNER_TEMP:-$(mktemp -d)}
            ks="$ks_dir/release.jks"
            trap 'rm -f "$ks"' EXIT
            (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks")
            # v2/v3 only: a v4 signature would leave an extra .idsig file in dist/.
            build_tool apksigner sign --v4-signing-enabled false --ks "$ks" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --out "dist/$APK_NAME" "$apk"
            SIGNING=release
          elif [ "$PRERELEASE" = true ]; then
            install -m644 "$apk" "dist/$APK_NAME"
            SIGNING=debug
            echo '::warning::APK is debug-signed with a key created for this build; it cannot be installed as an update over a previous build.'
          else
            echo 'Releases must be signed with the release key: set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS.' >&2
            exit 1
          fi
          chmod 644 "dist/$APK_NAME"

          # Exactly one signer; release builds must carry the pinned release certificate,
          # because Android only installs an update signed like the installed app.
          # (The nixos/nix image has grep but no sed/awk.)
          build_tool apksigner verify --print-certs "dist/$APK_NAME" > apksigner.txt
          grep -v '^WARNING' apksigner.txt || true
          mapfile -t digests < <(grep '^Signer #[0-9]* certificate SHA-256 digest: ' apksigner.txt || true)
          if [ "${#digests[@]}" -ne 1 ]; then
            echo "Expected exactly one APK signer" >&2
            exit 1
          fi
          CERT_SHA256=${digests[0]##*: }
          PINNED=$(tr -d '[:space:]' < dashboard-ui/android/release-signing-cert.sha256)
          if [ "$SIGNING" = release ] && [ "$CERT_SHA256" != "$PINNED" ]; then
            echo "APK signer $CERT_SHA256 is not the release certificate $PINNED" >&2
            exit 1
          fi

          # The APK's own version must be the tag's version.
          build_tool aapt2 dump badging "dist/$APK_NAME" > badging.txt
          head -n1 badging.txt
          expected="package: name='cc.attodao.ahd' versionCode='$VERSION_CODE' versionName='$APP_VERSION' "
          case "$(head -n1 badging.txt)" in
            "$expected"*) ;;
            *) echo "APK manifest does not start with: $expected" >&2; exit 1 ;;
          esac

          # Only the named packages are release assets (docs/releases.md).
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "dist/$APK_NAME" ]; then
            echo "Unexpected files in dist/: ${files[*]}" >&2
            exit 1
          fi

          # One checksum file over every package of this release.
          (cd dist && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS dist/SHA256SUMS
          cat dist/SHA256SUMS
          {
            echo "APK_NAME=$APK_NAME"
            echo "SIGNING=$SIGNING"
            echo "CERT_SHA256=$CERT_SHA256"
          } >> "$GITHUB_ENV"
      - name: Publish release assets
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AHD_SERVER_URL: ${{ vars.AHD_SERVER_URL || 'https://hoyo.attodao.cc' }}
        run: |
          set -eu
          RELEASE_BODY="Androidアプリ: $APK_NAME（サーバー $AHD_SERVER_URL 向け、arm64）。チェックサムは SHA256SUMS、APK署名証明書のSHA-256は $CERT_SHA256 です。"
          if [ "$PRERELEASE" = true ]; then
            RELEASE_BODY="$RELEASE_BODY テスト用のプレリリースで、アプリの自動更新の対象外です。"
          fi
          if [ "$SIGNING" = debug ]; then
            RELEASE_BODY="$RELEASE_BODY このビルド専用のデバッグ鍵で署名されています。以前のAPKからは上書き更新できないため、アンインストールしてから入れてください。"
          fi
          export RELEASE_BODY
          export API="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          export TAG="$GITHUB_REF_NAME"
          nix shell github:NixOS/nixpkgs/3ec636362e1816bc2f0888fa0fa2c69f1bc9e504#curl github:NixOS/nixpkgs/3ec636362e1816bc2f0888fa0fa2c69f1bc9e504#jq \
            -c bash scripts/publish-release.sh dist
