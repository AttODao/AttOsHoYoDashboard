# Publishes the web release (server + browser UI) image to this Forgejo
# instance's container registry for every web tag (web-vX.Y.Z, version from the
# root Cargo.toml). App tags (vX.Y.Z) are built by android.yml; see docs/releases.md.
# Tests are not run here; run `devenv test` locally before tagging.
name: image

on:
  push:
    tags: ['web-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          set -eu
          bash scripts/release-version.sh "$GITHUB_REF_NAME" > release-version.env
          cat release-version.env
          grep -qx COMPONENT=web release-version.env || { echo "Not a web tag: $GITHUB_REF_NAME" >&2; exit 1; }
          cat release-version.env >> "$GITHUB_ENV"

      - name: Resolve image name and tags
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          registry="${SERVER_URL#*://}"
          image="$registry/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          # VERSION is the tag without `web-v` (release-version.sh), e.g. 1.8.1 or 1.8.1-test.1.
          tags="$image:$VERSION"
          # Only plain X.Y.Z releases move the X.Y and latest tags.
          if [ "$PRERELEASE" = false ]; then
            tags="$tags $image:${VERSION%.*} $image:latest"
          fi
          {
            echo "REGISTRY=$registry"
            echo "IMAGE=$image"
            echo "IMAGE_TAGS=$tags"
          } >> "$GITHUB_ENV"

      - name: Log in to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build and push
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          # Registry cache export needs a container builder, not the default docker driver.
          # The builder runs on the host's Docker daemon and outlives this job, so
          # remove leftovers of cancelled runs first and our own builder (with its
          # state volume) on exit. The runner executes one job at a time.
          docker ps -aq --filter name=buildx_buildkit_ahd- | xargs -r docker rm -f
          docker volume ls -q --filter name=buildx_buildkit_ahd- | xargs -r docker volume rm
          builder="ahd-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          trap 'docker buildx rm --force "$builder" || true' EXIT
          docker buildx create --name "$builder" --driver docker-container --use
          set --
          for tag in $IMAGE_TAGS; do set -- "$@" --tag "$tag"; done
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=$SERVER_URL/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$VERSION" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            "$@" \
            --push \
            .

      - name: Log out of registry
        if: always()
        run: docker logout "$REGISTRY" || true
